version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: fintax_db
      POSTGRES_USER: fintax_user
      POSTGRES_PASSWORD: fintax_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://fintax_user:fintax_pass@postgres:5432/fintax_db
      REDIS_URL: redis://redis:6379

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
